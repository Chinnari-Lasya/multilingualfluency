# Render Blueprint (FREE tier): PostgreSQL + FastAPI backend (Docker, rules-only) + Next.js frontend.
# Every service uses Render's free plan. The backend is built from docker/backend-lite.Dockerfile, which installs no
# PyTorch/transformers, so no AI model is loaded and it fits in free-tier memory: O2 does rule-based fixes only and
# O3 abstains. For the full neural system use docker/backend.Dockerfile on a larger plan with a model disk.
# Free-tier notes: web services sleep after ~15 min idle (first request then takes ~1 min), and free Postgres
# databases expire after 30 days unless upgraded.
# Local development is unaffected (see compose.yaml / README).
# Values marked `sync: false` are prompted for when the Blueprint is applied (never stored in git).

databases:
  - name: gec-db
    databaseName: gec
    user: gec
    plan: free

services:
  # ------------------------------------------------------------------ backend / API
  - type: web
    name: gec-coach-api
    runtime: docker
    dockerfilePath: ./docker/backend-lite.Dockerfile
    dockerContext: .
    plan: free                     # 512 MB RAM: rules-only, no AI models
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8000"              # the Dockerfile CMD binds 8000
      - key: GEC_DATABASE_URL
        sync: false                # postgresql+psycopg://USER:PASSWORD@HOST:5432/gec  (see instructions: note the "+psycopg")
      - key: GEC_JWT_SECRET
        generateValue: true
      - key: GEC_SEED_DEMO_USERS
        value: "0"                 # never seed learner/educator/admin demo accounts in production
      - key: GEC_AUTO_DOWNLOAD
        value: "0"                 # AI models are off: never download Hugging Face checkpoints
      - key: GEC_DOWNLOAD_TRANSLATOR
        value: "0"                 # translator is off too (no disk, not enough memory)
      - key: GEC_ALLOW_ROLE_SELF_SELECT
        value: "0"                 # keep 0 in production: Admin is NEVER self-created (see the note below)
      - key: GEC_EDUCATOR_INVITE_CODE
        sync: false                # secret: educators must enter this code at sign-up. 24+ random chars. Give it only to educators.
      # ADMIN: there is no admin sign-up in production. Register the account as a learner, then promote it once in the
      # database (Render dashboard -> gec-db -> Connect -> PSQL command):
      #   UPDATE users SET role='admin' WHERE username='<the exact username/email you registered>';
      - key: GEC_ALLOWED_ORIGINS
        sync: false                # the frontend's public URL, e.g. https://gec-coach-web.onrender.com (no trailing slash)
      - key: GEC_LLM_PROVIDER
        value: none

  # ------------------------------------------------------------------ frontend
  - type: web
    name: gec-coach-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT   # package.json's `start` is hard-wired to 3000; Render assigns $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        sync: false                # the backend's public URL, e.g. https://gec-coach-api.onrender.com (no trailing slash)
